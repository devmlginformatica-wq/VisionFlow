<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vision Flow</title>
  <script>
    (() => {
      const key = 'visionflow:theme'
      const defaultColor = '#1AA7A4'
      let mode = 'system'
      let color = defaultColor

      try {
        const stored = JSON.parse(localStorage.getItem(key) || 'null')
        if (stored && typeof stored === 'object') {
          if (['light', 'dark', 'system'].includes(stored.mode)) mode = stored.mode
          if (typeof stored.primaryColor === 'string' && /^#[\da-f]{6}$/i.test(stored.primaryColor)) {
            color = stored.primaryColor
          }
        }
      } catch {
        // Mantém os valores padrão quando a preferência armazenada não é válida.
      }

      const resolvedMode = mode === 'system'
        ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
        : mode
      document.documentElement.classList.toggle('dark', resolvedMode === 'dark')

      const red = Number.parseInt(color.slice(1, 3), 16)
      const green = Number.parseInt(color.slice(3, 5), 16)
      const blue = Number.parseInt(color.slice(5, 7), 16)
      const darken = (channel) => Math.round(channel * 0.9).toString(16).padStart(2, '0')
      const linearize = (channel) => {
        const normalized = channel / 255
        return normalized <= 0.04045 ? normalized / 12.92 : ((normalized + 0.055) / 1.055) ** 2.4
      }
      const luminance = 0.2126 * linearize(red) + 0.7152 * linearize(green) + 0.0722 * linearize(blue)
      const root = document.documentElement.style
      root.setProperty('--color-primary', color)
      root.setProperty('--color-primary-hover', `#${darken(red)}${darken(green)}${darken(blue)}`)
      root.setProperty('--color-primary-foreground', luminance > 0.179 ? '#000000' : '#FFFFFF')
      root.setProperty('--color-primary-soft', `rgba(${red}, ${green}, ${blue}, 0.1)`)
    })()
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
